<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPAL GROUP</title>
<style>
  :root{ --teal:#0b6b63; --teal-dark:#085049; --ink:#143b37; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 50% 0%, #15897e 0%, var(--teal) 45%, var(--teal-dark) 100%);
    color:#fff; min-height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:32px 20px;
  }
  .card{
    width:100%; max-width:380px; text-align:center;
  }
  .logo{
    width:120px; height:120px; margin:0 auto 22px;
    background:#fff; border-radius:50% 50% 48% 52% / 55% 55% 45% 45%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 18px 40px rgba(0,0,0,.25);
  }
  .logo .o{ font-size:46px; font-weight:800; letter-spacing:1px; color:var(--teal); line-height:1; }
  .logo .g{ font-size:15px; font-weight:600; color:var(--teal); letter-spacing:2px; margin-top:2px; }
  h1{ font-size:26px; letter-spacing:3px; font-weight:700; margin-bottom:6px; }
  .tag{ font-size:13px; opacity:.85; margin-bottom:34px; letter-spacing:1px; }
  a.btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:17px 20px; margin:14px 0;
    border-radius:16px; text-decoration:none; font-size:17px; font-weight:600;
    background:#fff; color:var(--ink);
    box-shadow:0 8px 22px rgba(0,0,0,.18);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  a.btn:active{ transform:scale(.97); box-shadow:0 4px 12px rgba(0,0,0,.18); }
  a.btn svg{ width:22px; height:22px; flex:0 0 auto; }
  .foot{ margin-top:34px; font-size:12px; opacity:.7; letter-spacing:1px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="o">OPAL</div>
      <div class="g">GROUP</div>
    </div>
    <h1>OPAL GROUP</h1>
    <p class="tag">Connect with us</p>

    <a class="btn" href="https://www.opal-group.net" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0b6b63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      Visit Website
    </a>

    <a class="btn" href="https://www.instagram.com/groupopal" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0b6b63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
      Follow on Instagram
    </a>

    <p class="foot">www.opal-group.net</p>
  </div>
</body>
</html>
